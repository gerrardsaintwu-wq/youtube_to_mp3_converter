<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <meta name="theme-color" content="#c1121f">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='images/logo.jpg') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="icon" type="image/jpg" href="{{ url_for('static', filename='images/logo.jpg') }}">
    <title>YouToMedia</title>
</head>
<body>
    <div class="top-container">
        <form onsubmit="startAnalysis(event)" id="mainForm">
            <h1>YouToMedia</h1>
            
            <!-- STEP 1: Analyze -->
            <div id="step-1" class="step-container">
                <input type="text" id="urlInput" placeholder="Paste YouTube Video or Playlist Link" required>
                <button type="submit" id="analyzeBtn">Analyze Link</button>
                
                <div id="analyze-progress" class="progress-area" style="display: none;">
                    <div class="bar-bg"><div class="bar-fg" id="analyze-bar" style="width: 0%; background-color: #007bff;"></div></div>
                    <p id="analyze-status-txt" class="status-txt">Initializing...</p>
                </div>
            </div>

            <!-- STEP 2: Configure -->
            <div id="step-2" class="step-container" style="display: none;">
                <div class="media-preview">
                    <img id="mediaThumb" src="" alt="Thumbnail" style="width: 120px; border-radius: 8px; object-fit: cover; display:none;">
                    <div class="media-info">
                        <h3 id="mediaTitle"></h3>
                        <p id="singleFileSize" style="font-size: 0.85rem; color: #666; margin-top: 5px;"></p>
                    </div>
                </div>
                
                <div id="playlist-container" style="display: none;">
                    <input type="text" id="playlistSearch" placeholder="Search playlist items..." oninput="filterPlaylist()" style="margin-bottom: 10px; padding: 10px; font-size: 0.9rem;">
                    <div class="playlist-header">
                        <span id="selectedCount" style="font-weight: bold;">Select Videos</span>
                        <label><input type="checkbox" id="selectAll" checked onchange="toggleAll(this)"> All</label>
                    </div>
                    <div class="playlist-list" id="pl-list"></div>
                </div>

                <div class="config-row">
                    <select id="formatSelect" class="format-dropdown" onchange="updateQualityLabelsAndSizes()">
                        <option value="mp3">Audio (MP3)</option>
                        <option value="mp4">Video (MP4)</option>
                    </select>
                    <select id="qualitySelect" class="format-dropdown" onchange="updateQualityLabelsAndSizes()">
                        <option value="high">High Quality (320 kbps)</option>
                        <option value="medium">Medium Quality (192 kbps)</option>
                        <option value="low">Low Quality (128 kbps)</option>
                    </select>
                </div>
                
                <label class="meta-checkbox">
                    <input type="checkbox" id="metaCheck" checked> Embed Metadata (Thumbnail, Title, Creator)
                </label>

                <div class="config-row">
                    <button type="button" onclick="resetApp()" style="background-color: #6c757d; flex: 1;">← Back</button>
                    <button type="button" id="convertBtn" onclick="startConversion()" style="flex: 2;">Convert Media</button>
                </div>
            </div>

            <!-- STEP 3: Progress & Manual Download -->
            <div id="step-3" class="step-container" style="display: none;">
                <div class="progress-area" style="display: block;">
                    <div class="bar-bg"><div class="bar-fg" id="bar"></div></div>
                    <p id="status-txt" class="status-txt">Starting...</p>
                </div>
                
                <!-- Updated Button Colors -->
                <button type="button" id="downloadBtn" style="display: none; margin-top: 15px; background-color: #c1121f;">Download File</button>
                <button type="button" id="resetBtn" onclick="handleReset()" style="display: none; margin-top: 10px; background-color: #6c757d;">Convert Another</button>
            </div>
        </form>
    </div>

    <script>
        let currentMedia = null;
        let hasDownloaded = true; // Tracks if the user has clicked download

        // Warns the user if they try to leave the page before downloading
        window.onbeforeunload = function(e) {
            if (!hasDownloaded) {
                e.preventDefault();
                e.returnValue = "You haven't downloaded your converted file yet! Are you sure you want to leave?";
                return e.returnValue;
            }
        };

        function estimateSize(durationSec, format, quality) {
            if (!durationSec) return 0;
            let mbPerSec = 0;
            if (format === 'mp3') {
                if (quality === 'high') mbPerSec = 0.04;
                else if (quality === 'medium') mbPerSec = 0.024;
                else mbPerSec = 0.016;
            } else {
                if (quality === 'high') mbPerSec = 0.5;
                else if (quality === 'medium') mbPerSec = 0.25;
                else mbPerSec = 0.13;
            }
            return durationSec * mbPerSec;
        }

        function formatSizeMB(mb) {
            if (mb === 0) return 'Size Unknown';
            if (mb < 1) return (mb * 1024).toFixed(1) + ' KB';
            if (mb > 1024) return (mb / 1024).toFixed(2) + ' GB';
            return mb.toFixed(1) + ' MB';
        }

        function updateQualityLabelsAndSizes() {
            const format = document.getElementById('formatSelect').value;
            const qualitySelect = document.getElementById('qualitySelect');
            const currentQuality = qualitySelect.value;
            
            if (format === 'mp3') {
                qualitySelect.innerHTML = `
                    <option value="high" ${currentQuality==='high'?'selected':''}>High Quality (320 kbps)</option>
                    <option value="medium" ${currentQuality==='medium'?'selected':''}>Medium Quality (192 kbps)</option>
                    <option value="low" ${currentQuality==='low'?'selected':''}>Low Quality (128 kbps)</option>
                `;
            } else {
                qualitySelect.innerHTML = `
                    <option value="high" ${currentQuality==='high'?'selected':''}>High Quality (1080p Video)</option>
                    <option value="medium" ${currentQuality==='medium'?'selected':''}>Medium Quality (720p Video)</option>
                    <option value="low" ${currentQuality==='low'?'selected':''}>Low Quality (480p Video)</option>
                `;
            }

            if (!currentMedia) return;
            const q = document.getElementById('qualitySelect').value;
            
            if (currentMedia.type === 'video') {
                const mb = estimateSize(currentMedia.duration, format, q);
                document.getElementById('singleFileSize').innerText = `Estimated Size: ~${formatSizeMB(mb)}`;
            } else if (currentMedia.type === 'playlist') {
                const data = currentMedia.videos || window._playlistData || [];
                data.forEach((vid, i) => {
                    const mb = estimateSize(vid.duration, format, q);
                    vid._estMb = mb;
                    const el = document.getElementById(`size-${i}`);
                    if (el) {
                        el.innerText = `~${formatSizeMB(mb)}`;
                        el.setAttribute('data-mb', mb);
                    }
                });
                updateSelectedCount();
            }
        }

        async function startAnalysis(e) {
            e.preventDefault();
            const btn = document.getElementById('analyzeBtn');
            const progressArea = document.getElementById('analyze-progress');
            const analyzeBar = document.getElementById('analyze-bar');
            const analyzeStatus = document.getElementById('analyze-status-txt');
            const url = document.getElementById('urlInput').value;
            
            btn.disabled = true;
            btn.style.display = 'none';
            progressArea.style.display = 'block';
            analyzeBar.style.width = '0%';
            analyzeStatus.innerText = 'Initializing analysis...';

            try {
                const startRes = await fetch('/api/analyze_start', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ url })
                });
                let startData;
                try {
                    startData = await startRes.json();
                } catch (e) {
                    const text = await startRes.text();
                    throw new Error(`Server error ${startRes.status}: ${text.substring(0, 100)}`);
                }
                
                if (!startRes.ok) throw new Error(startData.error || 'Analysis failed to start');

                const interval = setInterval(async () => {
                    const pollRes = await fetch(`/api/analyze_status?job_id=${startData.job_id}`);
                    const job = await pollRes.json();

                    if (job.status === 'error') {
                        clearInterval(interval);
                        alert("Analysis Failed: " + job.error);
                        resetAnalyzeUI(btn, progressArea);
                    } else {
                        analyzeBar.style.width = job.progress + '%';
                        analyzeStatus.innerText = job.message;

                        if (job.status === 'done') {
                            clearInterval(interval);
                            loadMediaUI(job.result);
                        }
                    }
                }, 400); 

            } catch (err) {
                alert("Analysis Failed: " + err.message);
                resetAnalyzeUI(btn, progressArea);
            }
        }

        function resetAnalyzeUI(btn, progressArea) {
            btn.disabled = false;
            btn.style.display = 'block';
            progressArea.style.display = 'none';
        }

        function loadMediaUI(data) {
            currentMedia = data;
            document.getElementById('step-1').style.display = 'none';
            document.getElementById('step-2').style.display = 'flex';
            document.getElementById('mediaTitle').innerText = data.title;
            
            if (data.thumbnail) {
                const thumb = document.getElementById('mediaThumb');
                thumb.src = data.thumbnail;
                thumb.style.display = 'block';
            }

            if (data.type === 'playlist') {
                document.getElementById('playlist-container').style.display = 'block';
                document.getElementById('singleFileSize').style.display = 'none';
                renderPlaylistItems(data.videos);
            } else {
                document.getElementById('playlist-container').style.display = 'none';
                document.getElementById('singleFileSize').style.display = 'block';
            }

            updateQualityLabelsAndSizes();
        }

        function renderPlaylistItems(videos) {
            const plList = document.getElementById('pl-list');
            plList.innerHTML = '';
            // Remove previous page-level scroll fallback listener
            if (window._playlistScrollHandler) {
                window.removeEventListener('scroll', window._playlistScrollHandler);
                plList.removeEventListener('scroll', window._playlistScrollHandler);
                window._playlistScrollHandler = null;
            }
            // Clear any existing sentinel
            const oldSentinel = document.getElementById('pl-sentinel');
            if (oldSentinel) oldSentinel.remove();
            if (!window._playlistData) window._playlistData = [];
            window._playlistData = videos.map((vid, i) => ({
                title: vid.title,
                url: vid.url,
                thumbnail: vid.thumbnail,
                duration: vid.duration,
                idx: i,
                selected: true
            }));
            window._playlistRenderIndex = 0;
            // Remove existing sentinel if any (fresh one added below)
            const oldCounter = document.getElementById('pl-shown-counter');
            if (oldCounter) oldCounter.remove();
            // Add shown counter
            const shownCounter = document.createElement('div');
            shownCounter.id = 'pl-shown-counter';
            shownCounter.style.fontSize = '0.8rem';
            shownCounter.style.color = '#666';
            shownCounter.style.marginTop = '6px';
            plList.parentElement.appendChild(shownCounter);
            // Render first chunk
            renderPlaylistChunk(50);
            // Add sentinel for infinite scroll
            const sentinel = document.createElement('div');
            sentinel.id = 'pl-sentinel';
            sentinel.style.height = '1px';
            plList.appendChild(sentinel);
            if ('IntersectionObserver' in window) {
                const obs = new IntersectionObserver((entries) => {
                    if (entries[0].isIntersecting) {
                        renderPlaylistChunk(50);
                    }
                }, { rootMargin: '300px 0px', threshold: 0 });
                obs.observe(sentinel);
                window._playlistObserver = obs;
            }
            // Scroll fallback (mobile-safe): fires when nearing bottom of list or page
            const nearBottom = () => {
                const data = window._playlistData || [];
                if ((window._playlistRenderIndex || 0) >= data.length) return;
                const rect = sentinel.getBoundingClientRect();
                if (rect.top < window.innerHeight + 300) {
                    renderPlaylistChunk(50);
                }
            };
            window.addEventListener('scroll', nearBottom, { passive: true });
            plList.addEventListener('scroll', nearBottom, { passive: true });
            window._playlistScrollHandler = nearBottom;
        }

        function renderPlaylistChunk(chunkSize) {
            const plList = document.getElementById('pl-list');
            const data = window._playlistData || [];
            const start = window._playlistRenderIndex || 0;
            if (start >= data.length) {
                const sentinel = document.getElementById('pl-sentinel');
                if (sentinel && window._playlistObserver) {
                    try { window._playlistObserver.unobserve(sentinel); } catch(e){}
                }
                updateShownCounter();
                return;
            }
            // Show loading indicator
            let loader = document.getElementById('pl-loader');
            if (!loader) {
                loader = document.createElement('div');
                loader.id = 'pl-loader';
                loader.innerText = 'Loading more items...';
                loader.style.fontSize = '0.8rem';
                loader.style.color = '#666';
                loader.style.padding = '6px 0';
                const sentinel = document.getElementById('pl-sentinel');
                if (sentinel) sentinel.insertAdjacentElement('beforebegin', loader);
                else plList.appendChild(loader);
            }
            const end = Math.min(start + chunkSize, data.length);
            let html = '';
            for (let i = start; i < end; i++) {
                const vid = data[i];
                const thumbSrc = vid.thumbnail ? vid.thumbnail.replace('hqdefault', 'mqdefault') : `https://i.ytimg.com/vi/${(vid.url.split('v=')[1]||vid.url.split('/').pop())}/mqdefault.jpg`;
                const checked = vid.selected !== false ? 'checked' : '';
                html += `
                    <div class="playlist-item" data-title="${vid.title.toLowerCase()}" data-idx="${i}">
                        <label class="pl-label">
                            <input type="checkbox" class="playlist-cb" value="${vid.url}" ${checked} onchange="onPlaylistCheckboxChange(this)" data-idx="${i}">
                            <img src="${thumbSrc}" loading="lazy" class="pl-thumb">
                            <div class="pl-info">
                                <span class="pl-title">${vid.title}</span>
                                <span class="pl-size" id="size-${i}" data-mb="0">~0 MB</span>
                            </div>
                        </label>
                    </div>
                `;
            }
            // Insert before sentinel if exists
            const sentinel = document.getElementById('pl-sentinel');
            if (loader && loader.parentNode) loader.parentNode.removeChild(loader);
            if (sentinel) {
                sentinel.insertAdjacentHTML('beforebegin', html);
            } else {
                plList.insertAdjacentHTML('beforeend', html);
            }
            window._playlistRenderIndex = end;
            // Update sizes for newly rendered items
            if (currentMedia && currentMedia.type === 'playlist') {
                updateQualityLabelsAndSizes();
            }
            updateSelectedCount();
            updateShownCounter();
        }

        function updateShownCounter() {
            const counter = document.getElementById('pl-shown-counter');
            const data = window._playlistData || [];
            const rendered = document.querySelectorAll('.playlist-item').length;
            if (counter) {
                counter.innerText = `Showing ${rendered} of ${data.length} items`;
            }
        }

        function onPlaylistCheckboxChange(cb) {
            const idx = parseInt(cb.getAttribute('data-idx'));
            if (window._playlistData && window._playlistData[idx]) {
                window._playlistData[idx].selected = cb.checked;
            }
            updateSelectedCount();
        }

        function filterPlaylist() {
            const query = document.getElementById('playlistSearch').value.toLowerCase();
            const data = window._playlistData || [];
            // Show/hide based on data; ensure items are rendered up to needed? just toggle existing rendered
            data.forEach((vid, i) => {
                const item = document.querySelector(`.playlist-item[data-idx="${i}"]`);
                if (item) {
                    const title = vid.title.toLowerCase();
                    item.style.display = title.includes(query) ? 'flex' : 'none';
                }
            });
            updateSelectedCount();
        }

        function toggleAll(source) {
            const data = window._playlistData || (currentMedia && currentMedia.videos) || [];
            // Update all checkboxes for rendered items
            const checkboxes = document.querySelectorAll('.playlist-cb');
            checkboxes.forEach(cb => {
                const item = cb.closest('.playlist-item');
                if (!item || item.style.display === 'none') return;
                cb.checked = source.checked;
            });
            // Also ensure state is consistent for rendered items
            data.forEach((vid, i) => {
                const cb = document.querySelector(`.playlist-cb[data-idx="${i}"]`);
                if (cb) {
                    const item = cb.closest('.playlist-item');
                    if (item && item.style.display !== 'none') {
                        cb.checked = source.checked;
                    }
                }
            });
            updateSelectedCount();
        }

        function updateSelectedCount() {
            const data = window._playlistData || (currentMedia && currentMedia.videos) || [];
            const format = document.getElementById('formatSelect') ? document.getElementById('formatSelect').value : 'mp3';
            const q = document.getElementById('qualitySelect') ? document.getElementById('qualitySelect').value : 'high';
            if (data.length > 0) {
                let checkedCount = 0;
                let totalMB = 0;
                data.forEach(v => {
                    if (v.selected !== false) {
                        checkedCount++;
                        let mb = v._estMb;
                        if (mb === undefined || mb === null) {
                            mb = estimateSize(v.duration, format, q);
                            v._estMb = mb;
                        }
                        totalMB += mb;
                    }
                });
                const elCount = document.getElementById('selectedCount');
                if (elCount) elCount.innerText = `Select Videos (${checkedCount}/${data.length}) - Total: ~${formatSizeMB(totalMB)}`;
                return;
            }
            const checkboxes = document.querySelectorAll('.playlist-cb');
            const checked = document.querySelectorAll('.playlist-cb:checked');
            let totalMB = 0;
            checked.forEach(cb => {
                const idx = cb.getAttribute('data-idx');
                const sizeEl = document.getElementById(`size-${idx}`);
                if (sizeEl) totalMB += parseFloat(sizeEl.getAttribute('data-mb') || 0);
            });
            const elCount = document.getElementById('selectedCount');
            if (elCount) elCount.innerText = `Select Videos (${checked.length}/${checkboxes.length}) - Total: ~${formatSizeMB(totalMB)}`;
        }

        async function startConversion() {
            let urls = [];
            let estimated_mb = 0;
            const format = document.getElementById('formatSelect').value;
            const quality = document.getElementById('qualitySelect').value;
            if (currentMedia.type === 'playlist') {
                const data = window._playlistData || [];
                if (data.length > 0) {
                    data.forEach(v => {
                        if (v.selected !== false) {
                            urls.push(v.url);
                            let mb = v._estMb;
                            if (mb === undefined || mb === null) {
                                mb = estimateSize(v.duration, format, quality);
                                v._estMb = mb;
                            }
                            estimated_mb += mb;
                        }
                    });
                } else {
                    const checkboxes = document.querySelectorAll('.playlist-cb:checked');
                    if (checkboxes.length === 0) return alert("Select at least one video!");
                    checkboxes.forEach(cb => {
                        urls.push(cb.value);
                        const idx = cb.getAttribute('data-idx');
                        const sizeEl = document.getElementById(`size-${idx}`);
                        if (sizeEl) estimated_mb += parseFloat(sizeEl.getAttribute('data-mb') || 0);
                    });
                }
                if (urls.length === 0) return alert("Select at least one video!");
            } else {
                urls.push(currentMedia.url);
                estimated_mb = estimateSize(currentMedia.duration, format, quality) || 0;
            }

            const metadata = document.getElementById('metaCheck').checked;
            const playlistTitle = currentMedia.title;

            document.getElementById('step-2').style.display = 'none';
            document.getElementById('step-3').style.display = 'flex';
            
            const bar = document.getElementById('bar');
            const statusTxt = document.getElementById('status-txt');
            const downloadBtn = document.getElementById('downloadBtn');
            const resetBtn = document.getElementById('resetBtn');
            
            bar.style.width = '0%'; 
            statusTxt.innerText = 'Initializing conversion...';

            try {
                const res = await fetch('/api/convert', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ urls, format, quality, metadata, playlist_title: playlistTitle, estimated_mb })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error);

                const interval = setInterval(async () => {
                    const pollRes = await fetch(`/api/status?job_id=${data.job_id}`);
                    const job = await pollRes.json();

                    if (job.status === 'error') {
                        clearInterval(interval);
                        statusTxt.innerText = "Error: " + job.error;
                        bar.style.backgroundColor = 'red';
                        resetBtn.style.display = 'block';
                    } else if (job.status === 'queued') {
                        // NEW: Tell the user they are in the waiting line
                        bar.style.width = '5%';
                        bar.style.backgroundColor = '#ffa500'; // Orange for waiting
                        statusTxt.innerText = "Server busy. Waiting in queue...";
                    } else {
                        // Job is processing
                        bar.style.backgroundColor = '#c1121f'; // Back to red for downloading
                        bar.style.width = job.progress + '%';
                        statusTxt.innerText = `Processing: ${job.progress}%`;

                        if (job.status === 'done') {
                            clearInterval(interval);
                            statusTxt.innerText = "Complete! Ready to download.";
                            hasDownloaded = false; 
                            downloadBtn.style.display = 'block';
                            resetBtn.style.display = 'block';
                            downloadBtn.onclick = () => {
                                hasDownloaded = true;
                                window.location.href = `/download?token=${job.token}`;
                            };
                        }
                    }
                }, 1500);

            } catch (err) {
                statusTxt.innerText = "Failed to start: " + err.message;
                resetBtn.style.display = 'block';
            }
        }

        function handleReset() {
            if (!hasDownloaded) {
                const confirmReset = confirm("You haven't downloaded your converted file yet! Are you sure you want to convert another one?");
                if (!confirmReset) return; // Stop if they click 'Cancel'
            }
            hasDownloaded = true; // Clear the flag for the next cycle
            resetApp();
        }

        function resetApp() {
            currentMedia = null;
            document.getElementById('urlInput').value = '';
            document.getElementById('playlistSearch').value = '';
            document.getElementById('mediaThumb').style.display = 'none';
            document.getElementById('mediaTitle').innerText = '';
            
            const plList = document.getElementById('pl-list');
            if (plList) plList.innerHTML = '';
            
            const analyzeBtn = document.getElementById('analyzeBtn');
            analyzeBtn.disabled = false;
            analyzeBtn.style.display = 'block';
            document.getElementById('analyze-progress').style.display = 'none';
            
            document.getElementById('step-3').style.display = 'none';
            document.getElementById('step-2').style.display = 'none';
            document.getElementById('step-1').style.display = 'flex';
            
            document.getElementById('downloadBtn').style.display = 'none';
            document.getElementById('resetBtn').style.display = 'none';
            
            const bar = document.getElementById('bar');
            bar.style.width = '0%';
            bar.style.backgroundColor = '#c1121f'; 
        }
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register("{{ url_for('static', filename='sw.js') }}")
                    .then(reg => console.log('Service Worker registered.'))
                    .catch(err => console.error('Service Worker registration failed:', err));
            });
        }

        // Admin Dashboard Toggle (Only spawns on the host machine)
        window.addEventListener('load', () => {
            if (window.location.hostname === '127.0.0.1' || window.location.hostname === 'localhost') {
                const adminBtn = document.createElement('button');
                adminBtn.innerText = "👑 Toggle Public Limits";
                adminBtn.style.cssText = "position: fixed; bottom: 15px; right: 15px; background: #000; color: #fff; border: 2px solid #c1121f; padding: 12px 15px; border-radius: 12px; cursor: pointer; z-index: 9999; font-family: sans-serif; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.3);";
                
                adminBtn.onclick = async () => {
                    try {
                        const res = await fetch('/api/admin/toggle', { method: 'POST' });
                        const data = await res.json();
                        if (res.ok) alert("SUCCESS: " + data.message);
                        else alert("ERROR: " + data.error);
                    } catch (e) {
                        alert("Failed to reach the server.");
                    }
                };
                
                document.body.appendChild(adminBtn);
            }
        });
    </script>
</body>
</html>
